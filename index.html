}

/* ---------- vertical calculation ---------- */
const carries=(a,b)=>{let c=0,n=0;while(a>0||b>0||c){const s=a%10+b%10+c;c=s>=10?1:0;n+=c;a=Math.floor(a/10);b=Math.floor(b/10);}return n;};
const borrows=(a,b)=>{let br=0,n=0,chain=0;while(a>0||b>0){const x=a%10-br,y=b%10;if(x<0)chain=1;if(x<y){br=1;n++;}else br=0;a=Math.floor(a/10);b=Math.floor(b/10);}return{n,chain};};
function vsteps(a,b,op){
  const A=String(a).split('').reverse().map(Number),B=String(b).split('').reverse().map(Number);
  const L=Math.max(A.length,B.length),steps=[],mk=Array.from({length:L+2},()=>[]);
  if(op==='+'){
    let c=0;
    for(let i=0;i<L;i++){
      const da=A[i]||0,db=B[i]||0,s=da+db+c,p=PN[i];let t;
      if(i>=B.length&&!c)t=p+'位：'+da+' 照著寫下來。';
      else t=p+'位：'+da+(i<B.length?' + '+db:'')+(c?' + 進位的 1':'')+' = '+s;
      if(s>=10){t+='，寫 '+(s-10)+'，向'+PN[i+1]+'位進 1';mk[i+1].push('+1');}
      steps.push(t);c=s>=10?1:0;
    }
    if(c)steps.push(PN[L]+'位：把進位的 1 寫下來。');
  }else{
    let br=0;
    for(let i=0;i<L;i++){
      const da=A[i]||0,db=B[i]||0,p=PN[i],top=da-br,pre=br?da+' 被借走 1，剩 '+top+'，':'';
      if(top>=db){steps.push(p+'位：'+pre+top+' − '+db+' = '+(top-db));br=0;}
      else{steps.push(p+'位：'+pre+top+' 不夠減 '+db+'，向'+PN[i+1]+'位借 1，變成 '+(top+10)+'，'+(top+10)+' − '+db+' = '+(top+10-db));mk[i].push('+10');mk[i+1].push('−1');br=1;}

}
function vtab(a,b,op,mk){
  const r=String(op==='+'?a+b:op==='×'?a*b:a-b),L=Math.max(String(a).length,String(b).length,r.length);
  const dg=n=>{const s=String(n).split('').reverse();while(s.length<L)s.push('');return s;};
  const cols=[];for(let k=L-1;k>=0;k--)cols.push(k);
  const row=(arr,cls)=>'<tr class="'+(cls||'')+'">'+arr+'</tr>';
  const A=dg(a),B=dg(b),R=dg(r);
  return '<table class="vert">'+
    row('<td></td>'+cols.map(k=>'<td>'+((mk[k]||[]).join(' '))+'</td>').join(''),'m')+
    row('<td></td>'+cols.map(k=>'<td>'+A[k]+'</td>').join(''))+
    row('<td>'+(op==='+'?'+':op==='×'?'×':'−')+'</td>'+cols.map(k=>'<td>'+B[k]+'</td>').join(''))+
    row('<td></td>'+cols.map(k=>'<td>'+R[k]+'</td>').join(''),'ln')+'</table>';
}
function vqa(a,b,op){

function cmpSteps(a,b){
  const A=String(a),B=String(b),L=Math.max(A.length,B.length),s=[];
  if(A.length!==B.length){const hi=A.length>B.length?a:b;return[a+' 有 '+A.length+' 個數字，'+b+' 有 '+B.length+' 個數字。','位數比較多的比較大：<mark>'+hi+'</mark> 比較大。'];}
  for(let i=0;i<L;i++){const p=PN[L-1-i],x=A[i],y=B[i];

}

const IT=[{n:'糖果',m:'顆'},{n:'蘋果',m:'個'},{n:'餅乾',m:'片'},{n:'香蕉',m:'根'}];

const UN4=[['公里','公尺',1000],['公斤','公克',1000],['公升','毫升',1000],['公噸','公斤',1000],['公尺','公分',100]];
function gUnit4(lv){

  if(k==='dh4'){const a=ri(1,9),b=ri(1,59);return N({expr:a+' 小時 '+b+' 分 = {} 分',ans:a*60+b,ev:a+'*60+'+b,ex:{steps:['1 小時 = 60 分，'+a+' 小時 = '+a*60+' 分。',a*60+' + '+b+' = <mark>'+(a*60+b)+'</mark>。']}});}
  const x=ri(1,9),y=ri(1,9),v=10*x+y,h=f/10;

const CT=[['箱','瓶','果汁'],['盒','枝','鉛筆'],['袋','顆','橘子'],['包','片','餅乾']];
function story4(k,a,b,c){
  const t=pick(CT),X=t[0],Y=t[1],Z=t[2];let say,ans,steps,unit=Y;
  switch(k){
    case'mul':say='每'+X+'有 '+a+' '+Y+Z+'，'+b+' '+X+'共有幾'+Y+'？';ans=a*b;steps=['每'+X+' '+a+' '+Y+'，有 '+b+' '+X+'，用乘法：','<b>'+a+' × '+b+' = '+ans+'</b>','答案是 <mark>'+ans+'</mark> '+Y+'。'];break;
    case'div':say='有 '+a+' '+Y+Z+'，平分給 '+b+' 位小朋友，每人最多分到幾'+Y+'？';ans=Math.floor(a/b);steps=['平分，用除法：','<b>'+a+' ÷ '+b+' = '+ans+(a%b?' …… '+a%b:'')+'</b>',a%b?'剩下的 '+a%b+' '+Y+'不夠每人再分 1 '+Y+'，所以每人 <mark>'+ans+'</mark> '+Y+'。':'答案是 <mark>'+ans+'</mark> '+Y+'。'];break;
    case'price':say='每'+Y+Z+' '+a+' 元，買 '+b+' '+Y+'，付了 '+c+' 元，應找多少元？';ans=c-a*b;unit='元';steps=['先算總價：'+a+' × '+b+' = '+a*b+' 元。','找的錢 = 付的錢 − 總價：'+c+' − '+a*b+' = <mark>'+ans+'</mark> 元。'];break;
    case'trip':say='小明每天騎 '+a+' 公里，騎了 '+b+' 天，還要再騎 '+c+' 公里才到終點，全程共幾公里？';ans=a*b+c;unit='公里';steps=['先算已經騎的：'+a+' × '+b+' = '+a*b+' 公里。','再加上還沒騎的：'+a*b+' + '+c+' = <mark>'+ans+'</mark> 公里。'];break;
    case'book':say='一本書有 '+a+' 頁，已經看了 '+b+' 頁，剩下的平均 '+c+' 天看完，每天要看幾頁？';ans=(a-b)/c;unit='頁';steps=['先算剩下幾頁：'+a+' − '+b+' = '+(a-b)+' 頁。','再平分給 '+c+' 天：'+(a-b)+' ÷ '+c+' = <mark>'+ans+'</mark> 頁。'];break;
    case'garden':say='長方形花圃長 '+a+' 公尺、寬 '+b+' 公尺，每 1 平方公尺種 '+c+' 株花，一共種幾株？';ans=a*b*c;unit='株';steps=['先算面積：'+a+' × '+b+' = '+a*b+' 平方公尺。','再算花的數量：'+a*b+' × '+c+' = <mark>'+ans+'</mark> 株。'];break;
    case'split':say='每'+X+'有 '+a+' '+Y+Z+'，買了 '+b+' '+X+'，平分給 '+c+' 個人，每人分到幾'+Y+'？';ans=a*b/c;steps=['先算全部有多少：'+a+' × '+b+' = '+a*b+'。','再平分給 '+c+' 個人：'+a*b+' ÷ '+c+' = <mark>'+ans+'</mark> '+Y+'。'];break;
  }
  return N({say,expr:'{}',unit,ans,ev:ans,ex:{steps}});
}
function gWord4(lv){
  if(lv===1){
    if(Math.random()<.5)return story4('mul',ri(21,99),ri(11,40));
    const b=ri(3,9);return story4('div',ri(101,999),b);
  }
  if(lv===2){
    const k=pick(['price','trip','book']);
    if(k==='price'){const a=ri(11,60),b=ri(3,9);return story4('price',a,b,Math.ceil((a*b+1)/100)*100);}
    if(k==='trip')return story4('trip',ri(12,60),ri(3,9),ri(20,200));
    const c=ri(3,9),q=ri(8,40),b=ri(20,100);return story4('book',b+c*q,b,c);
  }
  const k=pick(['garden','split','price','book']);
  if(k==='garden')return story4('garden',ri(6,30),ri(4,20),ri(2,9));
  if(k==='split'){const c=ri(3,9);return story4('split',ri(12,48),c*ri(2,8),c);}
  if(k==='price'){const a=ri(25,98),b=ri(5,19);return story4('price',a,b,Math.ceil((a*b+1)/500)*500);}
  const c=ri(6,12),q=ri(15,45),b=ri(120,300);return story4('book',b+c*q,b,c);
}

function start(id,lv){

  const u=UNITS[S.grade].find(x=>x.id===id);
  P={u,lv,seen:{},n:S.set.n,asked:0,first:0,firstOk:0,pending:false,cur:null,typed:'',res:null,sel:-1,t0:Date.now(),tq:Date.now(),secs:0,starsGot:0,last:''};

function genQ(retry){
  let q,i=0;
  do{q=P.u.gen(P.lv);q.sig=q.say+'|'+q.expr+'|'+q.ans+'|'+q.vis.length;i++;}while((q.sig===P.last||(P.seen&&P.seen[q.sig]))&&i<12);if(P.seen)P.seen[q.sig]=1;
  P.last=q.sig;q.retry=retry;if(S.grade>=3&&!q.maxLen)q.maxLen=9;return q;
}
function nextQ(){
  if(P.pending){P.pending=false;P.cur=genQ(true);}
  else if(P.asked<P.n){P.asked++;P.cur=genQ(false);}
  else return finish();
  P.typed='';P.res=null;P.sel=-1;P.tq=Date.now();V='play';render();window.scrollTo(0,0);
}

    }).join('')+'</div>';
  }
  h+='<div id="fb">'+(P.res?fbHtml():'')+'</div>';
  return h;
}
function fbHtml(){
  const q=P.cur;
  if(P.res.ok)return '<div class="fb good"><div class="h">🎉 '+pick(['答對了！','太棒了！','好厲害！','答得好！'])+' ⭐ +1</div><button class="big" onclick="goNext()">下一題 ▶</button></div>';
  const lbl=q.type==='num'?'<mark>'+q.ans+'</mark> '+q.unit:'<mark>'+(q.html?q.ans:esc(q.ans))+'</mark>';
  return '<div class="fb bad"><div class="h">這題的答案是 '+lbl+'</div>'+(q.ex.vis?'<div class="vis">'+q.ex.vis+'</div>':'')+
    '<ol>'+q.ex.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><div style="text-align:center"><button class="big" onclick="goNext()">'+(q.retry?'下一題 ▶':'我懂了，再試一題 ▶')+'</button></div></div>';
}
function key(k){
  if(!P||P.res)return;
  if(k==='ok'){if(P.typed!=='')submit(P.typed);return;}
  if(k==='b')P.typed=P.typed.slice(0,-1);else if(k==='.'){if(P.cur.dec&&P.typed.indexOf('.')<0&&P.typed.length<7)P.typed+=(P.typed?'.':'0.');}else if(P.typed.length<(P.cur.maxLen||4))P.typed+=k;
  sndKey();const b=$('#box');if(b)b.innerHTML=P.typed?esc(P.typed):'&nbsp;&nbsp;&nbsp;';
}
function pickC(i){if(!P||P.res)return;P.sel=i;submit(P.cur.choices[i]);}
function submit(val){
  if(P.res)return;
  const q=P.cur,ok=q.dec?Math.abs(Number(val)-Number(q.ans))<1e-9:String(val)===String(q.ans),t=today();
  P.secs+=Math.min(90,(Date.now()-P.tq)/1000);
  const st=S.stats[P.u.id]=S.stats[P.u.id]||{a:0,c:0,b:{}};st.a++;if(ok)st.c++;
  const lg=S.log[t]=S.log[t]||{q:0,c:0,secs:0};lg.q++;if(ok)lg.c++;
  if(!q.retry){P.first++;if(ok)P.firstOk++;}
  if(ok){S.stars++;P.starsGot++;sndOk();}else{sndNo();if(!q.retry)P.pending=true;}
  P.res={ok};save();render();
}
function goNext(){nextQ();}
function addSecs(){const lg=S.log[today()]=S.log[today()]||{q:0,c:0,secs:0};lg.secs+=Math.round(P.secs||0);P.secs=0;
  const ks=Object.keys(S.log).sort();while(ks.length>60)delete S.log[ks.shift()];}
function quit(){addSecs();save();go('home');}
function finish(){
  addSecs();
  const st=S.stats[P.u.id]=S.stats[P.u.id]||{a:0,c:0,b:{}},pct=Math.round(P.firstOk/P.n*100);
  st.b[P.lv]=Math.max(st.b[P.lv]||0,pct);
  S.stars+=2;P.starsGot+=2;P.pct=pct;checkin();save();sndStar();V='result';render();window.scrollTo(0,0);
}
function vResult(){
  const p=P.pct,msg=p>=90?'太厲害了！':p>=70?'做得很好！':p>=50?'不錯喔，再練習會更棒！':'沒關係，多練習幾次就會進步！';
  return '<div class="card res"><div style="font-size:60px">'+(p>=80?'🏆':p>=50?'🎉':'💪')+'</div><div class="ttl">'+msg+'</div>'+
    '<div>第一次就答對 <span class="n">'+P.firstOk+'</span> / '+P.n+' 題</div><div>得到 ⭐ '+P.starsGot+'（含完成獎勵 2 顆）</div>'+
    '<div>🔥 連續 '+effStreak()+' 天　🏆 最高 '+S.streak.best+' 天</div>'+
    '<div class="row" style="justify-content:center;margin-top:12px"><button class="big" onclick="start(\''+P.u.id+'\','+P.lv+')">再玩一次</button><button class="big sec" onclick="go(\'home\')">回首頁</button></div></div>';
}

/* --- shop --- */
function vShop(){
  const av=AV[S.theme];
  let h='<div class="hdr"><button class="sm sec" onclick="go(\'home\')">◀ 回去</button><div class="who"><div class="ttl">商店</div></div><span class="chip">⭐ '+S.stars+'</span></div>';
  h+='<div class="card" style="text-align:center">'+avatar(1)+'<div class="row avs" style="justify-content:center">'+av.map(a=>'<button class="'+(S.avatar===a?'on':'')+'" onclick="setAv(\''+a+'\')">'+a+'</button>').join('')+'</div>'+
    '<div class="row pick" style="justify-content:center"><button class="sm" onclick="flipTheme()">換風格：變'+TN[TH[(TH.indexOf(S.theme)+1)%3]]+'</button></div></div>';
  h+='<div class="tabs"><button class="'+(shopTab==='acc'?'on':'')+'" onclick="shopTab=\'acc\';render()">造型</button><button class="'+(shopTab==='bg'?'on':'')+'" onclick="shopTab=\'bg\';render()">背景</button></div>';
  if(shopTab==='acc'){
    h+='<div class="shop">'+ACC.map((a,i)=>{
      const own=a[2]===0||S.owned.acc.includes(a[0]);
      return '<div class="it '+(S.acc===a[0]?'on':'')+'"><div style="font-size:40px">'+(a[0]||'🚫')+'</div><div>'+a[1]+'</div><button class="sm" onclick="buyAcc('+i+')">'+(S.acc===a[0]?'使用中':own?'使用':'⭐ '+a[2])+'</button></div>';
    }).join('')+'</div>';
  }else{
    h+='<div class="shop">'+Object.keys(BGS).map(k=>{
      const b=BGS[k],own=b[2]===0||S.owned.bg.includes(k);
      return '<div class="it '+(S.bg===k?'on':'')+'"><div class="sw" style="background:'+b[1]+'"></div><div>'+b[0]+'</div><button class="sm" onclick="buyBg(\''+k+'\')">'+(S.bg===k?'使用中':own?'使用':'⭐ '+b[2])+'</button></div>';
    }).join('')+
    '<div class="it '+(S.bg==='custom'?'on':'')+'"><div style="font-size:40px">🖼️</div><div>我的照片</div><label><span class="sm" style="display:inline-block;background:var(--pri);color:#fff;border-radius:var(--r);padding:4px 12px;cursor:pointer">上傳</span><input type="file" accept="image/*" style="display:none" onchange="upBg(this)"></label></div></div>';
  }
  return h;
}
function setAv(a){S.avatar=a;save();render();}
const TH=['cute','cool','plain'],TN={cute:'可愛',cool:'帥氣',plain:'簡潔'};
function flipTheme(){S.theme=TH[(TH.indexOf(S.theme)+1)%3];S.avatar=AV[S.theme][0];save();render();}
function buyAcc(i){
  const a=ACC[i];
  if(a[2]===0||S.owned.acc.includes(a[0]))S.acc=a[0];
  else if(S.stars>=a[2]){S.stars-=a[2];S.owned.acc.push(a[0]);S.acc=a[0];sndStar();}
  else{toast('星星還不夠，再多練習一下吧！');return;}
  save();render();
}
function buyBg(k){
  const b=BGS[k];
  if(b[2]===0||S.owned.bg.includes(k))S.bg=k;
  else if(S.stars>=b[2]){S.stars-=b[2];S.owned.bg.push(k);S.bg=k;sndStar();}
  else{toast('星星還不夠，再多練習一下吧！');return;}
  save();render();
}
function upBg(inp){
  const f=inp.files[0];if(!f)return;const img=new Image(),r=new FileReader();
  r.onload=()=>{img.onload=()=>{
    const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const old=[S.customBg,S.bg];S.customBg=c.toDataURL('image/jpeg',.6);S.bg='custom';
    if(!save()){S.customBg=old[0];S.bg=old[1];toast('照片太大，存不下');}
    render();
  };img.src=r.result;};
  r.readAsDataURL(f);
}

/* --- parent --- */
function vParent(){
  const us=UNITS[1].concat(UNITS[2],UNITS[3],UNITS[4]),days=[];
  for(let i=0;i<7;i++){const d=dstr(new Date(Date.now()-i*864e5));days.push([d,S.log[d]||{q:0,c:0,secs:0}]);}
  const opt=(arr,cur,fn)=>'<div class="row pick">'+arr.map(a=>'<button class="sm '+(cur===a[0]?'on':'')+'" onclick="'+fn+'('+a[0]+')">'+a[1]+'</button>').join('')+'</div>';
  let h='<div class="hdr"><button class="sm sec" onclick="go(\'home\')">◀ 回去</button><div class="who"><div class="ttl">家長頁</div></div></div>';
  h+='<div class="card"><b>近 7 天練習</b><table class="st"><tr><th>日期</th><th>題數</th><th>答對</th><th>分鐘</th></tr>'+days.map(d=>'<tr><td>'+d[0].slice(5)+'</td><td>'+d[1].q+'</td><td>'+d[1].c+'</td><td>'+Math.round(d[1].secs/60)+'</td></tr>').join('')+'</table>'+
    '<div>連續 '+effStreak()+' 天，最高紀錄 '+S.streak.best+' 天，累計打卡 '+S.streak.total+' 天</div></div>';
  const rows=us.filter(u=>S.stats[u.id]);
  h+='<div class="card"><b>各單元表現</b>'+(rows.length?'<table class="st"><tr><th>單元</th><th>作答</th><th>正確率</th><th></th></tr>'+rows.map(u=>{
    const s=S.stats[u.id],p=Math.round(s.c/s.a*100),weak=s.a>=10&&p<60;
    return '<tr><td>'+'一二三四'[u.id[1]-1]+'年級 '+u.n+'</td><td>'+s.a+'</td><td>'+p+'%</td><td class="'+(weak?'weak':'')+'">'+(weak?'需要加強':'')+'</td></tr>';
  }).join('')+'</table>':'<div>還沒有紀錄。</div>')+'</div>';
  h+='<div class="card"><b>設定</b><div>年級</div>'+opt([[1,'1 年級'],[2,'2 年級'],[3,'3 年級'],[4,'4 年級']],S.grade,'setGrade')+
    '<div>字的大小（注音會跟著變大）</div>'+opt([[0,'標準'],[32,'大'],[38,'特大']],S.set.fs||0,'setFs')+'<div>每回合題數</div>'+opt([[5,'5 題'],[8,'8 題'],[10,'10 題']],S.set.n,'setN')+
    '<div>每天練習時間上限</div>'+opt([[0,'不限'],[15,'15 分鐘'],[20,'20 分鐘'],[30,'30 分鐘'],[45,'45 分鐘'],[60,'60 分鐘']],S.set.limit,'setLim')+
    '<div class="row pick"><button class="sm '+(S.set.zy?'on':'')+'" onclick="S.set.zy=!S.set.zy;save();render()">注音：'+(S.set.zy?'開':'關')+'</button><button class="sm '+(S.set.sound?'on':'')+'" onclick="S.set.sound=!S.set.sound;save();render()">音效：'+(S.set.sound?'開':'關')+'</button></div></div>';
  h+='<div class="card"><b>資料備份</b><div class="row"><button class="sm" onclick="exportData()">匯出 JSON</button><label><span class="sm" style="display:inline-block;background:var(--pri);color:#fff;border-radius:var(--r);padding:4px 12px;cursor:pointer;box-shadow:0 4px 0 var(--pri2)">匯入 JSON</span><input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label><button class="sm sec" onclick="resetAll()">清除全部資料</button></div>'+
    (EXP?'<textarea id="exp" readonly rows="4"></textarea><div class="row"><button class="sm" onclick="copyExp()">複製備份文字</button></div>':'')+
    '<div>貼上備份文字，再按匯入</div><textarea id="imp" rows="3" placeholder="貼上備份文字"></textarea><div class="row"><button class="sm" onclick="importText()">匯入貼上的文字</button></div></div>';
  return h;
}
function setGrade(g){S.grade=g;S.set.zy=g<=2;save();render();}
function setFs(n){S.set.fs=n;save();render();}
function setN(n){S.set.n=n;save();render();}
function setLim(n){S.set.limit=n;save();render();}
let EXP='';
function exportData(){
  EXP=JSON.stringify(S);render();
  try{const bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(bl);a.download='math-kids-backup-'+today()+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}catch(e){}
}
function copyExp(){
  const t=$('#exp');if(!t)return;t.select();
  try{navigator.clipboard.writeText(t.value).then(()=>toast('已複製'),()=>toast('已選取，請手動複製'));}catch(e){toast('已選取，請手動複製');}
}
function applyImport(txt){
  try{const d=JSON.parse(txt);if(!d||d.v!==1)throw 0;S=norm(d);save();EXP='';toast('匯入成功！');go('home');}catch(e){toast('檔案格式不正確');}
}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyImport(r.result);r.readAsText(f);}
function importText(){const t=$('#imp');if(t&&t.value.trim())applyImport(t.value.trim());else toast('請先貼上備份文字');}
let RST=0;
function resetAll(){
  if(!RST){RST=1;toast('再按一次，才會清除全部資料');setTimeout(()=>{RST=0;},4000);return;}RST=0;
  try{localStorage.removeItem(KEY);}catch(e){}S=defS();go('setup');
}

/* ---------- boot ---------- */
if(typeof document!=='undefined'){
  document.addEventListener('keydown',e=>{
    if(V!=='play'||!P||P.cur.type!=='num')return;
    if(/^[0-9.]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('b');else if(e.key==='Enter')P.res?goNext():key('ok');
  });
  const d=load();if(d)S=d;
  if(!S.grade){V='setup';SU.theme=S.theme;}else V='home';
  render();
}
if(typeof module!=='undefined'&&module.exports)module.exports={UNITS,ZY,zy,S,cmpSteps,carries,borrows};

</script>
</body>
